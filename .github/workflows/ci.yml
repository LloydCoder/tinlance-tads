name: TADS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tads-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: tads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tads_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - name: Diagnose Ruff formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -m ruff format --diff src tests > /tmp/ruff-format.diff
          status=$?
          if [ -s /tmp/ruff-format.diff ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/ruff-format.diff
          fi
          exit $status
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -m pip_audit
      - run: python -m pytest
