[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-tads"
version = "0.1.0"
description = "Tinlance Target Account Demand Signal Intelligence contracts"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Tinlance" }]
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1", "pip-audit>=2.7,<3", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
no_implicit_optional = true
packages = ["tads_contracts", "tads_sources", "tads_quality", "tads_signalops", "tads_change", "tads_graph", "tads_db", "tads_ingest", "tads_resolution", "tads_signals", "tads_temporal", "tads_accounts", "tads_opportunities", "tads_agents", "tads_integrations", "tads_assurance", "tads_console", "tads_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires PostgreSQL"]

[tool.setuptools.package-data]
tads_db = ["migrations/*.sql"]
