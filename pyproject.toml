[build-system]\nrequires = ["setuptools>=75", "wheel"]\nbuild-backend = "setuptools.build_meta"\n\n[project]\nname = "tinlance-tads"\nversion = "0.1.0"\ndescription = "Tinlance Target Account Demand Signal Intelligence contracts"\nrequires-python = ">=3.12"\nlicense = { text = "Proprietary" }\nauthors = [{ name = "Tinlance" }]\ndependencies = ["psycopg[binary]>=3.2,<4"]\n\n[project.optional-dependencies]\ndev = ["mypy>=1.13,<2", "pytest>=8.3,<9", "ruff>=0.8,<1", "pip-audit>=2.7,<3", "psycopg[binary]>=3.2,<4"]\n\n[tool.setuptools.packages.find]\nwhere = ["src"]\n\n[tool.ruff]\nline-length = 100\ntarget-version = "py312"\nexclude = ["build", ".venv"]\n\n[tool.ruff.lint]\nselect = ["E", "F", "I", "UP", "B", "SIM"]\n\n[tool.mypy]\npython_version = "3.12"\nstrict = true\nwarn_unused_ignores = true\nno_implicit_optional = true\npackages = ["tads_contracts", "tads_sources", "tads_db", "tads_ingest", "tads_resolution", "tads_signals", "tads_temporal", "tads_accounts", "tads_opportunities", "tads_agents", "tads_integrations", "tads_assurance", "tads_console", "tads_runtime"]\n\n[tool.pytest.ini_options]\ntestpaths = ["tests"]\naddopts = "-q"\nmarkers = ["integration: requires PostgreSQL"]\n\n[tool.setuptools.package-data]\ntads_db = ["migrations/*.sql"]\n